<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пылесосы — Каталог товаров</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/category.css">
</head>
<body>

  <main class="catalog">
    <div class="container">
      <h1 class="catalog__title">Пылесосы</h1>

      <div class="product-grid">
        <article class="product-card">
          <img
            class="product-card__image"
            src="images/vacuum-cleaner-1.jpg"
            alt="Вертикальный пылесос"
          >

          <div class="product-card__content">
            <h2 class="product-card__title">Вертикальный пылесос</h2>
            <p class="product-card__description">
              Лёгкий и удобный для ежедневной уборки.
            </p>
            <p class="product-card__price">7 990 ₽</p>
            <button
              class="button button--primary product-card__button"
              data-product="Вертикальный пылесос"
              data-price="7 990 ₽"
              data-image="images/vacuum-cleaner-1.jpg"
            >
              Заказать
            </button>
          </div>
        </article>

        <article class="product-card">
          <img
            class="product-card__image"
            src="images/vacuum-cleaner-2.jpg"
            alt="Робот-пылесос"
          >

          <div class="product-card__content">
            <h2 class="product-card__title">Робот-пылесос</h2>
            <p class="product-card__description">
              Автоматическая уборка без лишних усилий.
            </p>
            <p class="product-card__price">12 990 ₽</p>
            <button
              class="button button--primary product-card__button"
              data-product="Робот-пылесос"
              data-price="12 990 ₽"
              data-image="images/vacuum-cleaner-2.jpg"
            >
              Заказать
            </button>
          </div>
        </article>

        <article class="product-card">
          <img
            class="product-card__image"
            src="images/vacuum-cleaner-3.jpg"
            alt="Компактный пылесос"
          >

          <div class="product-card__content">
            <h2 class="product-card__title">Компактный пылесос</h2>
            <p class="product-card__description">
              Компактный корпус и высокая мощность.
            </p>
            <p class="product-card__price">5 990 ₽</p>
            <button
              class="button button--primary product-card__button"
              data-product="Компактный пылесос"
              data-price="5 990 ₽"
              data-image="images/vacuum-cleaner-3.jpg"
            >
              Заказать
            </button>
          </div>
        </article>

        <article class="product-card">
          <img
            class="product-card__image"
            src="images/vacuum-cleaner-4.jpg"
            alt="Мощный пылесос для дома"
          >

          <div class="product-card__content">
            <h2 class="product-card__title">Мощный пылесос для дома</h2>
            <p class="product-card__description">
              Для тщательной уборки любых поверхностей.
            </p>
            <p class="product-card__price">9 990 ₽</p>
            <button
              class="button button--primary product-card__button"
              data-product="Мощный пылесос для дома"
              data-price="9 990 ₽"
              data-image="images/vacuum-cleaner-4.jpg"
            >
              Заказать
            </button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
